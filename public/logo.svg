<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-labelledby="title desc">
  <title id="title">TidePool</title>
  <desc id="desc">TidePool — high-performance, production-ready FTP connection pool for Java. Ocean waves cresting inside a circular pool badge.</desc>

  <defs>
    <linearGradient id="tideBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <circle cx="60" cy="60" r="56" fill="url(#tideBg)"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- waves (deep -> mid -> crest) -->
  <g clip-path="url(#badgeClip)">
    <path d="M0 92 C 12 68, 12 68, 24 92 C 36 116, 36 116, 48 92 C 60 68, 60 68, 72 92 C 84 116, 84 116, 96 92 C 108 68, 108 68, 120 92 L 120 120 L 0 120 Z" fill="#075985"/>
    <path d="M0 86 C 12 62, 12 62, 24 86 C 36 110, 36 110, 48 86 C 60 62, 60 62, 72 86 C 84 110, 84 110, 96 86 C 108 62, 108 62, 120 86 L 120 120 L 0 120 Z" fill="#0284c7"/>
    <path d="M0 80 C 12 56, 12 56, 24 80 C 36 104, 36 104, 48 80 C 60 56, 60 56, 72 80 C 84 104, 84 104, 96 80 C 108 56, 108 56, 120 80 L 120 120 L 0 120 Z" fill="#7dd3fc"/>

    <!-- foam crest -->
    <path d="M0 74 C 12 50, 12 50, 24 74 C 36 98, 36 98, 48 74 C 60 50, 60 50, 72 74 C 84 98, 84 98, 96 74 C 108 50, 108 50, 120 74"
          fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>

    <!-- bubbles: pooled connections rising from the tide -->
    <circle cx="34" cy="46" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="50" cy="34" r="3"   fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="66" cy="42" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="82" cy="30" r="2"   fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="138" y="78" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="0.5">TidePool</text>
  <text x="138" y="99" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="3">HIGH-PERFORMANCE FTP CONNECTION POOL</text>
</svg>